<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux-Grundlagen</title>
<meta name="description" content="Linux-Kommandozeile und Systemadministration lernen: Lektionen, Quiz und Übungen auf Deutsch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Layout-Idee: aufgeschlagene Manpage – Kopfzeile wie "NAME(1)", links das Inhaltsverzeichnis, rechts eine gut lesbare Textspalte. */
:root {
  --papier: #f3f5f7;
  --flaeche: #ffffff;
  --tinte: #17212b;
  --gedaempft: #5a6774;
  --linie: #d6dde4;
  --akzent: #e0a100;
  --akzent-text: #8a5c00;
  --akzent-weich: #fbefcf;
  --gut: #1d7449;
  --gut-weich: #dff2e7;
  --schlecht: #b3261e;
  --schlecht-weich: #fbe3e1;
  --code-grund: #e9edf1;
  --schrift-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --schrift-text: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #10161c; --flaeche: #172028; --tinte: #e5eaef; --gedaempft: #94a2af; --linie: #27323d;
    --akzent: #f2b632; --akzent-text: #f2b632; --akzent-weich: #3a2e10;
    --gut: #5fd49a; --gut-weich: #11301f; --schlecht: #ff8a80; --schlecht-weich: #3b1715; --code-grund: #0c1116;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #10161c; --flaeche: #172028; --tinte: #e5eaef; --gedaempft: #94a2af; --linie: #27323d;
  --akzent: #f2b632; --akzent-text: #f2b632; --akzent-weich: #3a2e10;
  --gut: #5fd49a; --gut-weich: #11301f; --schlecht: #ff8a80; --schlecht-weich: #3b1715; --code-grund: #0c1116;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--papier); color: var(--tinte);
  font: 17px/1.6 var(--schrift-text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--akzent-text); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; border-radius: 4px; }
code, pre, kbd { font-family: var(--schrift-mono); font-size: 0.88em; }
:not(pre) > code { background: var(--code-grund); padding: 0.1em 0.35em; border-radius: 4px; white-space: nowrap; }
td :not(pre) > code, li :not(pre) > code, p :not(pre) > code { white-space: normal; overflow-wrap: anywhere; }
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.25; }

/* ---------- Kopfzeile im Manpage-Stil ---------- */
.kopf {
  position: sticky; top: 0; z-index: 10;
  background: var(--papier); border-bottom: 1px solid var(--linie);
}
.manzeile {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center;
  padding: 10px clamp(16px, 3vw, 32px);
  font: 600 13px var(--schrift-mono); letter-spacing: 0.04em; color: var(--gedaempft);
}
.manzeile .rechts { text-align: right; }
.manzeile .mitte { color: var(--tinte); }
.reiter { display: flex; gap: 4px; padding: 0 clamp(16px, 3vw, 32px); overflow-x: auto; }
.reiter a {
  font: 600 14px var(--schrift-mono); text-decoration: none; color: var(--gedaempft);
  padding: 8px 14px 10px; border-bottom: 3px solid transparent; white-space: nowrap;
}
.reiter a[aria-current="page"] { color: var(--tinte); border-bottom-color: var(--akzent); }
.reiter a:hover { color: var(--tinte); }

/* ---------- Grundgerüst ---------- */
.rahmen { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: clamp(24px, 4vw, 56px);
  max-width: 1240px; margin: 0 auto; padding: 32px clamp(16px, 3vw, 32px) 80px; }
.rahmen.ohne-seite { grid-template-columns: minmax(0, 1fr); max-width: 900px; }
.seitenleiste { position: sticky; top: 110px; align-self: start; max-height: calc(100vh - 130px); overflow-y: auto; padding-right: 8px; }
.seitenleiste h2 { font: 800 12px var(--schrift-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gedaempft); margin: 20px 0 6px; }
.seitenleiste h2:first-child { margin-top: 0; }
.seitenleiste ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.seitenleiste a { display: grid; grid-template-columns: 2.4em 1fr; gap: 6px; padding: 6px 10px; border-radius: 6px;
  text-decoration: none; color: var(--tinte); font-size: 15px; line-height: 1.35; }
.seitenleiste a .nr { font: 600 13px/1.6 var(--schrift-mono); color: var(--gedaempft); }
.seitenleiste a:hover { background: var(--flaeche); }
.seitenleiste a[aria-current="page"] { background: var(--akzent-weich); }
.seitenleiste a[aria-current="page"] .nr { color: var(--akzent-text); }
.unterpunkte { margin: 4px 0 8px 3.2em !important; border-left: 2px solid var(--linie); }
.unterpunkte button { all: unset; cursor: pointer; display: block; padding: 3px 10px; font-size: 14px; color: var(--gedaempft); }
.unterpunkte button:hover { color: var(--tinte); }
.mobilwahl { display: none; }

main { min-width: 0; }
.text { max-width: 70ch; }

/* ---------- Lektionstext ---------- */
.lektion h1 { font: 800 clamp(28px, 4vw, 40px)/1.15 var(--schrift-mono); letter-spacing: -0.02em; margin: 0 0 8px; }
.lektion .unterzeile { font: 600 13px var(--schrift-mono); color: var(--gedaempft); letter-spacing: 0.06em; margin: 0 0 28px; }
.lektion h2 { font: 800 22px var(--schrift-mono); margin: 44px 0 12px; padding-top: 16px; border-top: 1px solid var(--linie); scroll-margin-top: 120px; }
.lektion h3 { font: 700 18px var(--schrift-mono); margin: 28px 0 8px; scroll-margin-top: 120px; }
.lektion p, .lektion li { max-width: 70ch; }
.lektion ul, .lektion ol { padding-left: 1.4em; }
.lektion li { margin: 4px 0; }
.lektion li::marker { color: var(--akzent-text); font-family: var(--schrift-mono); }
.lektion blockquote, .aufgabe blockquote { margin: 20px 0; padding: 12px 18px; background: var(--akzent-weich); border-left: 4px solid var(--akzent); border-radius: 0 8px 8px 0; max-width: 70ch; }
.lektion blockquote p, .aufgabe blockquote p { margin: 0; }
.tabelle { overflow-x: auto; margin: 16px 0 24px; border: 1px solid var(--linie); border-radius: 8px; background: var(--flaeche); }
table { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.45; }
th, td { text-align: left; vertical-align: top; padding: 9px 14px; border-bottom: 1px solid var(--linie); }
tr:last-child td { border-bottom: 0; }
th { font: 600 13px var(--schrift-mono); color: var(--gedaempft); background: var(--papier); letter-spacing: 0.03em; }
.code { position: relative; margin: 14px 0 22px; }
.code pre { margin: 0; padding: 16px 18px; background: var(--code-grund); border: 1px solid var(--linie); border-radius: 8px; overflow-x: auto; line-height: 1.55; }
.code pre code { font-size: 14px; }
.kopieren { position: absolute; top: 8px; right: 8px; font: 600 12px var(--schrift-mono); padding: 4px 9px; border-radius: 5px;
  border: 1px solid var(--linie); background: var(--flaeche); color: var(--gedaempft); cursor: pointer; opacity: 0.85; }
.kopieren:hover { opacity: 1; color: var(--tinte); }
.abschluss { margin-top: 48px; padding: 22px; border: 1px solid var(--linie); border-radius: 10px; background: var(--flaeche); display: grid; gap: 14px; }
.abschluss h2 { margin: 0; padding: 0; border: 0; font-size: 18px; }
.knopfreihe { display: flex; flex-wrap: wrap; gap: 10px; }
.vorzurueck { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; flex-wrap: wrap; }

/* ---------- Knöpfe ---------- */
.knopf { display: inline-flex; align-items: center; gap: 8px; font: 600 15px var(--schrift-mono); padding: 10px 18px; border-radius: 8px;
  border: 1px solid var(--linie); background: var(--flaeche); color: var(--tinte); cursor: pointer; text-decoration: none; }
.knopf:hover { border-color: var(--tinte); }
.knopf.haupt { background: var(--tinte); color: var(--papier); border-color: var(--tinte); }
.knopf.haupt:hover { background: var(--akzent-text); border-color: var(--akzent-text); }
.knopf:disabled { opacity: 0.45; cursor: not-allowed; }

/* ---------- Startseite ---------- */
.held { padding: clamp(16px, 4vw, 40px) 0 8px; }
.prompt { font: 800 clamp(30px, 6vw, 60px)/1.1 var(--schrift-mono); letter-spacing: -0.03em; margin: 0; }
.prompt .dollar { color: var(--akzent); }
.cursor { display: inline-block; width: 0.55em; height: 0.95em; background: var(--akzent); vertical-align: -0.08em; margin-left: 0.08em; animation: blinken 1.1s steps(1) infinite; }
@keyframes blinken { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
.held .lead { font-size: clamp(18px, 2.2vw, 21px); max-width: 60ch; color: var(--gedaempft); margin: 20px 0 24px; }
.zahlen { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 0 0 28px; padding: 0; list-style: none; font-family: var(--schrift-mono); }
.zahlen b { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
.zahlen span { color: var(--gedaempft); font-size: 14px; margin-left: 6px; }
.index { margin-top: 44px; display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 28px; }
.index h2 { font: 800 13px var(--schrift-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gedaempft); margin: 0 0 8px; }
.index ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--linie); }
.index li { border-bottom: 1px solid var(--linie); }
.index a { display: grid; grid-template-columns: 3em 1fr auto; gap: 8px; align-items: baseline; padding: 11px 4px; text-decoration: none; color: var(--tinte); }
.index a:hover { background: var(--flaeche); }
.index .nr { font: 600 14px var(--schrift-mono); color: var(--akzent-text); }
.index .info { font: 400 13px var(--schrift-mono); color: var(--gedaempft); white-space: nowrap; }
.terminal { margin-top: 44px; }

/* ---------- Quiz ---------- */
.quiz h1, .uebungen h1 { font: 800 clamp(28px, 4vw, 38px) var(--schrift-mono); letter-spacing: -0.02em; margin: 0 0 8px; }
.quiz .lead, .uebungen .lead { color: var(--gedaempft); margin: 0 0 24px; max-width: 65ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 20px; }
.chip { display: inline-flex; gap: 8px; align-items: center; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--linie);
  background: var(--flaeche); cursor: pointer; font-size: 14px; color: var(--tinte); }
.chip .nr { font: 600 12px var(--schrift-mono); color: var(--gedaempft); }
.chip .best { font: 600 11px var(--schrift-mono); color: var(--gut); }
.chip[aria-pressed="true"] { background: var(--tinte); color: var(--papier); border-color: var(--tinte); }
.chip[aria-pressed="true"] .nr, .chip[aria-pressed="true"] .best { color: var(--akzent); }
.einstellungen { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; margin-bottom: 22px; }
.einstellungen label { font: 600 14px var(--schrift-mono); color: var(--gedaempft); }
select { font: 15px var(--schrift-mono); padding: 7px 10px; border-radius: 6px; border: 1px solid var(--linie); background: var(--flaeche); color: var(--tinte); }
.karte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 12px; padding: clamp(18px, 3vw, 30px); max-width: 760px; }
.fortschritt { display: flex; justify-content: space-between; gap: 12px; font: 600 13px var(--schrift-mono); color: var(--gedaempft); margin-bottom: 10px; flex-wrap: wrap; }
.balken { height: 6px; background: var(--linie); border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
.balken div { height: 100%; background: var(--akzent); transition: width 0.25s ease; }
.frage { font-size: clamp(19px, 2.4vw, 22px); font-weight: 700; line-height: 1.4; margin: 0 0 20px; }
.optionen { display: grid; gap: 10px; }
.option { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 2em 1fr; gap: 10px; align-items: baseline; padding: 12px 14px;
  border: 1px solid var(--linie); border-radius: 8px; cursor: pointer; background: var(--papier); line-height: 1.45; }
.option:hover:not([disabled]) { border-color: var(--tinte); }
.option:focus-visible { outline: 3px solid var(--akzent); }
.option .buchstabe { font: 800 15px var(--schrift-mono); color: var(--gedaempft); }
.option.richtig { border-color: var(--gut); background: var(--gut-weich); }
.option.richtig .buchstabe { color: var(--gut); }
.option.falsch { border-color: var(--schlecht); background: var(--schlecht-weich); }
.option.falsch .buchstabe { color: var(--schlecht); }
.option[disabled] { cursor: default; }
.eingabe { display: flex; align-items: center; gap: 10px; background: var(--code-grund); border: 1px solid var(--linie); border-radius: 8px; padding: 4px 6px 4px 14px; }
.eingabe .ps1 { font: 800 16px var(--schrift-mono); color: var(--akzent); }
.eingabe input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--tinte); font: 16px var(--schrift-mono); padding: 10px 0; outline: none; }
.eingabe:focus-within { border-color: var(--akzent); }
.hinweiszeile { font-size: 14px; color: var(--gedaempft); margin: 8px 0 0; }
.rueckmeldung { margin-top: 18px; padding: 14px 16px; border-radius: 8px; border-left: 4px solid; }
.rueckmeldung.gut { background: var(--gut-weich); border-color: var(--gut); }
.rueckmeldung.schlecht { background: var(--schlecht-weich); border-color: var(--schlecht); }
.rueckmeldung strong { display: block; margin-bottom: 4px; }
.rueckmeldung .loesung code { white-space: normal; }
.aktionen { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.ergebnis .gross { font: 800 clamp(48px, 9vw, 84px)/1 var(--schrift-mono); letter-spacing: -0.04em; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
.ergebnis .gross small { font-size: 0.4em; color: var(--gedaempft); letter-spacing: 0; }
.fehlerliste { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; }
.fehlerliste li { padding: 12px 14px; border: 1px solid var(--linie); border-radius: 8px; background: var(--papier); }
.fehlerliste .thema { font: 600 12px var(--schrift-mono); color: var(--gedaempft); }

/* ---------- Übungen ---------- */
.uebung { border: 1px solid var(--linie); border-radius: 10px; background: var(--flaeche); margin-bottom: 12px; scroll-margin-top: 120px; }
.uebung > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 3em 1fr auto; gap: 10px; align-items: baseline; padding: 14px 18px; }
.uebung > summary::-webkit-details-marker { display: none; }
.uebung > summary .nr { font: 800 15px var(--schrift-mono); color: var(--akzent-text); }
.uebung > summary .titel { font-weight: 700; }
.uebung > summary .pfeil { font-family: var(--schrift-mono); color: var(--gedaempft); transition: transform 0.2s; }
.uebung[open] > summary .pfeil { transform: rotate(90deg); }
.aufgabe { padding: 0 18px 18px 18px; border-top: 1px solid var(--linie); }
.aufgabe p, .aufgabe li { max-width: 70ch; }
.befehle { display: grid; gap: 8px; margin: 16px 0; }
.befehle .code { margin: 0; }
details.tipp { margin-top: 10px; }
details.tipp summary { cursor: pointer; font: 600 14px var(--schrift-mono); color: var(--akzent-text); }
details.tipp p { margin: 8px 0 0; padding: 10px 14px; background: var(--akzent-weich); border-radius: 8px; }

.fuss { border-top: 1px solid var(--linie); padding: 18px clamp(16px, 3vw, 32px); font: 13px var(--schrift-mono); color: var(--gedaempft);
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

@media (max-width: 860px) {
  .rahmen { grid-template-columns: minmax(0, 1fr); padding-top: 20px; }
  .seitenleiste { display: none; }
  .mobilwahl { display: block; margin-bottom: 20px; }
  .mobilwahl select { width: 100%; }
  .manzeile .rechts, .manzeile .links { font-size: 11px; }
}
@media (max-width: 480px) {
  body { font-size: 16px; }
  .manzeile { grid-template-columns: 1fr auto; }
  .manzeile .rechts { display: none; }
  .index a { grid-template-columns: 2.6em 1fr; }
  .index .info { display: none; }
}
</style>
</head>
<body>
<header class="kopf">
  <div class="manzeile"><span class="links">LINUX-GRUNDLAGEN(1)</span><span class="mitte">Lernhandbuch</span><span class="rechts">LINUX-GRUNDLAGEN(1)</span></div>
  <nav class="reiter" aria-label="Bereiche">
    <a href="#start" data-bereich="start">Start</a>
    <a href="#lektion-01" data-bereich="lektion">Lektionen</a>
    <a href="#quiz" data-bereich="quiz">Quiz</a>
    <a href="#uebungen" data-bereich="uebungen">Übungen</a>
  </nav>
</header>
<div id="app" class="rahmen ohne-seite"></div>
<footer class="fuss">
  <span>Linux-Grundlagen · MIT-Lizenz</span>
  <a href="https://github.com/mark5378/Linux_Grundlagen_Claude" rel="noopener" target="_blank">Quellcode auf GitHub</a>
</footer>

<script>
const DATEN = /*__DATEN__*/null;
const REPO = "https://github.com/mark5378/Linux_Grundlagen_Claude";
const app = document.getElementById("app");
const ALLE_FRAGEN = DATEN.themen.reduce((n, t) => n + t.fragen.length, 0);

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const normal = s => s.trim().split(/\s+/).join(" ");
// Text aus den Fragedateien: `code` hervorheben
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const speicher = {
  lesen(k, d) { try { const v = localStorage.getItem("lg-" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  schreiben(k, v) { try { localStorage.setItem("lg-" + k, JSON.stringify(v)); } catch {} }
};
const teil = nr => (Number(nr) <= 6 ? 1 : 2);
const themaTitel = nr => (DATEN.themen.find(t => t.nr === nr) || {}).titel || nr;
const uebungTitel = nr => (DATEN.uebungen.find(u => u.nr === nr) || {}).titel || "";

function codeBlock(text) {
  return `<div class="code"><pre><code>${esc(text)}</code></pre><button class="kopieren" type="button">Kopieren</button></div>`;
}

// ---------------- Startseite
function zeigeStart() {
  app.className = "rahmen ohne-seite";
  const zeile = l => {
    const fragen = (DATEN.themen.find(t => t.nr === l.nr) || { fragen: [] }).fragen.length;
    return `<li><a href="#lektion-${l.nr}"><span class="nr">${l.nr}</span><span>${esc(l.titel)}</span><span class="info">${fragen} Fragen</span></a></li>`;
  };
  app.innerHTML = `<main>
    <section class="held">
      <p class="prompt"><span class="dollar">$</span> man linux<span class="cursor" aria-hidden="true"></span></p>
      <p class="lead">Die Linux-Kommandozeile und die Grundlagen der Systemadministration Schritt für Schritt lernen: Lektion lesen, im Quiz prüfen, im Terminal üben.</p>
      <ul class="zahlen">
        <li><b>${DATEN.lektionen.length}</b><span>Lektionen</span></li>
        <li><b>${ALLE_FRAGEN}</b><span>Quizfragen</span></li>
        <li><b>${DATEN.uebungen.length}</b><span>Übungen mit automatischer Prüfung</span></li>
      </ul>
      <div class="knopfreihe">
        <a class="knopf haupt" href="#lektion-01">Mit Lektion 01 beginnen</a>
        <a class="knopf" href="#quiz">Quiz starten</a>
        <a class="knopf" href="#uebungen">Übungen ansehen</a>
      </div>
    </section>
    <div class="index">
      <section><h2>Teil 1 · Kommandozeile</h2><ol>${DATEN.lektionen.filter(l => teil(l.nr) === 1).map(zeile).join("")}</ol></section>
      <section><h2>Teil 2 · Systemadministration</h2><ol>${DATEN.lektionen.filter(l => teil(l.nr) === 2).map(zeile).join("")}</ol></section>
    </div>
    <section class="terminal text">
      <h2 style="font:800 18px var(--schrift-mono)">Übungen im eigenen Terminal</h2>
      <p>Quiz und Lektionen laufen hier im Browser. Für die praktischen Übungen brauchst du ein Linux-Terminal, z. B. Ubuntu unter WSL auf Windows:</p>
      ${codeBlock(`git clone ${REPO}.git\ncd Linux_Grundlagen_Claude\n./uebung.sh liste`)}
    </section>
  </main>`;
}

// ---------------- Lektionen
function seitenleiste(aktiv) {
  const gruppe = n => DATEN.lektionen.filter(l => teil(l.nr) === n).map(l => {
    const ist = l.nr === aktiv.nr;
    const unter = ist && l.abschnitte.length
      ? `<ol class="unterpunkte">${l.abschnitte.map((a, i) => `<li><button type="button" data-ziel="${i}">${a}</button></li>`).join("")}</ol>` : "";
    return `<li><a href="#lektion-${l.nr}"${ist ? ' aria-current="page"' : ""}><span class="nr">${l.nr}</span><span>${esc(l.titel)}</span></a>${unter}</li>`;
  }).join("");
  return `<nav class="seitenleiste" aria-label="Lektionen"><h2>Teil 1 · Kommandozeile</h2><ol>${gruppe(1)}</ol><h2>Teil 2 · Administration</h2><ol>${gruppe(2)}</ol></nav>`;
}

function zeigeLektion(nr) {
  const idx = Math.max(0, DATEN.lektionen.findIndex(l => l.nr === nr));
  const l = DATEN.lektionen[idx];
  const vor = DATEN.lektionen[idx - 1], nach = DATEN.lektionen[idx + 1];
  const fragen = (DATEN.themen.find(t => t.nr === l.nr) || { fragen: [] }).fragen.length;
  const uebungen = l.uebungen.map(u => `<a class="knopf" href="#uebung-${u}">Übung ${u} · ${esc(uebungTitel(u))}</a>`).join("");
  app.className = "rahmen";
  app.innerHTML = `${seitenleiste(l)}
  <main>
    <div class="mobilwahl"><label for="lektionswahl" class="hinweiszeile">Lektion wählen</label>
      <select id="lektionswahl">${DATEN.lektionen.map(x => `<option value="${x.nr}"${x.nr === l.nr ? " selected" : ""}>${x.nr} · ${esc(x.titel)}</option>`).join("")}</select></div>
    <article class="lektion">
      <h1>${esc(l.titel)}</h1>
      <p class="unterzeile">LEKTION ${l.nr} · TEIL ${teil(l.nr)}</p>
      ${l.html}
      <section class="abschluss">
        <h2>Gelernt? Dann prüf dich.</h2>
        <div class="knopfreihe">
          <button class="knopf haupt" type="button" id="quiz-thema">${fragen} Quizfragen zu „${esc(l.titel)}“</button>
          ${uebungen}
        </div>
      </section>
      <div class="vorzurueck">
        ${vor ? `<a class="knopf" href="#lektion-${vor.nr}">← ${vor.nr} ${esc(vor.titel)}</a>` : "<span></span>"}
        ${nach ? `<a class="knopf" href="#lektion-${nach.nr}">${nach.nr} ${esc(nach.titel)} →</a>` : ""}
      </div>
    </article>
  </main>`;
  const ueberschriften = app.querySelectorAll(".lektion h2:not(.abschluss h2)");
  app.querySelectorAll(".unterpunkte button").forEach(b => b.addEventListener("click", () => {
    const ziel = ueberschriften[Number(b.dataset.ziel)];
    if (ziel) ziel.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }));
  document.getElementById("lektionswahl").addEventListener("change", e => { location.hash = "lektion-" + e.target.value; });
  document.getElementById("quiz-thema").addEventListener("click", () => {
    quiz.auswahl = new Set([l.nr]); quiz.direkt = true; location.hash = "quiz";
  });
}

// ---------------- Quiz
const quiz = {
  auswahl: new Set(speicher.lesen("auswahl", DATEN.themen.map(t => t.nr))),
  anzahl: speicher.lesen("anzahl", "10"),
  direkt: false,
  laeuft: null   // { fragen, pos, punkte, falsch, beantwortet }
};

function mischen(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function quizStarten(liste) {
  let fragen = liste || mischen(DATEN.themen.filter(t => quiz.auswahl.has(t.nr)).flatMap(t => t.fragen.map(f => ({ ...f, thema: t.nr }))));
  if (!liste && quiz.anzahl !== "alle") fragen = fragen.slice(0, Number(quiz.anzahl));
  quiz.laeuft = { fragen, pos: 0, punkte: 0, falsch: [], beantwortet: false };
  zeigeFrage();
}

function zeigeQuiz() {
  app.className = "rahmen ohne-seite";
  if (quiz.direkt) { quiz.direkt = false; quiz.anzahl = "alle"; quizStarten(); return; }
  if (quiz.laeuft) { quiz.laeuft.ende ? zeigeErgebnis() : zeigeFrage(); return; }
  const bestwerte = speicher.lesen("best", {});
  const chips = DATEN.themen.map(t => `<button class="chip" type="button" data-nr="${t.nr}" aria-pressed="${quiz.auswahl.has(t.nr)}">
      <span class="nr">${t.nr}</span>${esc(t.titel)}${bestwerte[t.nr] != null ? `<span class="best">${bestwerte[t.nr]} %</span>` : ""}</button>`).join("");
  app.innerHTML = `<main class="quiz">
    <h1>Quiz</h1>
    <p class="lead">Wähle die Themen und leg los. Es gibt Multiple-Choice-Fragen und Fragen, bei denen du den Befehl eintippst. Gängige Schreibweisen werden akzeptiert.</p>
    <div class="einstellungen">
      <label>Themen</label>
      <button class="knopf" type="button" id="alle">Alle</button>
      <button class="knopf" type="button" id="keine">Keine</button>
    </div>
    <div class="chips">${chips}</div>
    <div class="einstellungen">
      <label for="anzahl">Fragen</label>
      <select id="anzahl">${["10", "20", "40", "alle"].map(a => `<option value="${a}"${a === quiz.anzahl ? " selected" : ""}>${a === "alle" ? "alle" : a}</option>`).join("")}</select>
      <span class="hinweiszeile" id="verfuegbar"></span>
    </div>
    <button class="knopf haupt" type="button" id="los">Quiz starten</button>
  </main>`;
  const aktualisieren = () => {
    const n = DATEN.themen.filter(t => quiz.auswahl.has(t.nr)).reduce((s, t) => s + t.fragen.length, 0);
    document.getElementById("verfuegbar").textContent = `${n} Fragen in ${quiz.auswahl.size} Themen verfügbar`;
    document.getElementById("los").disabled = n === 0;
    app.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", quiz.auswahl.has(c.dataset.nr)));
    speicher.schreiben("auswahl", [...quiz.auswahl]);
  };
  app.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    quiz.auswahl.has(c.dataset.nr) ? quiz.auswahl.delete(c.dataset.nr) : quiz.auswahl.add(c.dataset.nr); aktualisieren();
  }));
  document.getElementById("alle").onclick = () => { quiz.auswahl = new Set(DATEN.themen.map(t => t.nr)); aktualisieren(); };
  document.getElementById("keine").onclick = () => { quiz.auswahl = new Set(); aktualisieren(); };
  document.getElementById("anzahl").onchange = e => { quiz.anzahl = e.target.value; speicher.schreiben("anzahl", quiz.anzahl); };
  document.getElementById("los").onclick = () => quizStarten();
  aktualisieren();
}

function zeigeFrage() {
  const q = quiz.laeuft, f = q.fragen[q.pos];
  const optionen = f.o.length
    ? `<div class="optionen" role="group" aria-label="Antworten">${f.o.map(([b, t]) => `<button class="option" type="button" data-b="${b}"><span class="buchstabe">${b}</span><span>${fmt(t)}</span></button>`).join("")}</div>
       <p class="hinweiszeile">Tipp: Du kannst auch die Tasten A–D drücken.</p>`
    : `<form class="eingabe" id="befehl"><span class="ps1" aria-hidden="true">$</span>
         <input id="antwort" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Befehl oder Antwort eingeben" placeholder="Befehl eintippen …">
         <button class="knopf haupt" type="submit">Prüfen</button></form>
       <p class="hinweiszeile">Antwort eintippen und mit Enter prüfen.</p>`;
  app.innerHTML = `<main class="quiz"><div class="karte">
    <div class="fortschritt"><span>Frage ${q.pos + 1} von ${q.fragen.length}</span><span>${f.thema} · ${esc(themaTitel(f.thema))}</span><span>${q.punkte} richtig</span></div>
    <div class="balken" aria-hidden="true"><div style="width:${(q.pos / q.fragen.length) * 100}%"></div></div>
    <p class="frage">${fmt(f.f)}</p>
    ${optionen}
    <div id="feedback" aria-live="polite"></div>
    <div class="aktionen"><button class="knopf" type="button" id="abbrechen">Quiz beenden</button></div>
  </div></main>`;
  q.beantwortet = false;
  if (f.o.length) {
    app.querySelectorAll(".option").forEach(o => o.addEventListener("click", () => beantworten(o.dataset.b)));
    app.querySelector(".option").focus({ preventScroll: true });
  } else {
    const feld = document.getElementById("antwort");
    feld.focus({ preventScroll: true });
    document.getElementById("befehl").addEventListener("submit", e => { e.preventDefault(); if (feld.value.trim()) beantworten(feld.value); });
  }
  document.getElementById("abbrechen").onclick = () => { q.fragen = q.fragen.slice(0, q.pos + (q.beantwortet ? 1 : 0)); q.ende = true; zeigeErgebnis(); };
}

function beantworten(antwort) {
  const q = quiz.laeuft, f = q.fragen[q.pos];
  if (q.beantwortet) return;
  q.beantwortet = true;
  const richtig = f.o.length ? antwort === f.l[0] : f.l.some(l => normal(l) === normal(antwort));
  if (richtig) q.punkte++; else q.falsch.push(f);
  if (f.o.length) {
    app.querySelectorAll(".option").forEach(o => {
      o.disabled = true;
      if (o.dataset.b === f.l[0]) o.classList.add("richtig");
      else if (o.dataset.b === antwort) o.classList.add("falsch");
    });
  } else {
    document.getElementById("antwort").readOnly = true;
    app.querySelector("#befehl button").disabled = true;
  }
  const loesung = f.o.length ? "" : `<div class="loesung">Richtig ist: <code>${esc(f.l[0])}</code>${f.l.length > 1 ? ` <span class="hinweiszeile">(auch akzeptiert: ${f.l.slice(1).map(x => `<code>${esc(x)}</code>`).join(", ")})</span>` : ""}</div>`;
  const zuletzt = q.pos + 1 === q.fragen.length;
  document.getElementById("feedback").innerHTML = `<div class="rueckmeldung ${richtig ? "gut" : "schlecht"}">
      <strong>${richtig ? "✔ Richtig!" : "✘ Leider falsch."}</strong>${richtig && f.o.length ? "" : loesung}${f.e ? `<div>${fmt(f.e)}</div>` : ""}</div>
    <div class="aktionen"><button class="knopf haupt" type="button" id="weiter">${zuletzt ? "Ergebnis anzeigen" : "Nächste Frage"} ↵</button></div>`;
  document.getElementById("weiter").focus({ preventScroll: true });
  document.getElementById("weiter").onclick = weiter;
}

function weiter() {
  const q = quiz.laeuft;
  if (!q.beantwortet) return;
  q.pos++;
  if (q.pos >= q.fragen.length) { q.ende = true; zeigeErgebnis(); } else { zeigeFrage(); window.scrollTo({ top: 0 }); }
}

function zeigeErgebnis() {
  const q = quiz.laeuft, n = q.fragen.length;
  if (n === 0) { quiz.laeuft = null; zeigeQuiz(); return; }
  const prozent = Math.round((q.punkte / n) * 100);
  // Bestwerte je Thema merken (nur wenn ein einzelnes Thema komplett gespielt wurde)
  const themen = [...new Set(q.fragen.map(f => f.thema))];
  if (themen.length === 1 && !q.gespeichert) {
    const best = speicher.lesen("best", {});
    best[themen[0]] = Math.max(best[themen[0]] || 0, prozent);
    speicher.schreiben("best", best); q.gespeichert = true;
  }
  const urteil = prozent === 100 ? "Perfekt! Bereit für das nächste Thema." : prozent >= 80 ? "Sehr gut!"
    : prozent >= 50 ? "Ganz ordentlich. Lies die Lektion noch einmal quer." : "Da geht noch was. Arbeite die Lektion noch einmal durch.";
  app.innerHTML = `<main class="quiz"><div class="karte ergebnis">
    <p class="fortschritt"><span>ERGEBNIS</span></p>
    <p class="gross">${q.punkte}<small> / ${n} richtig · ${prozent} %</small></p>
    <p>${urteil}</p>
    <div class="aktionen">
      ${q.falsch.length ? `<button class="knopf haupt" type="button" id="falsche">${q.falsch.length} falsche wiederholen</button>` : ""}
      <button class="knopf${q.falsch.length ? "" : " haupt"}" type="button" id="neu">Neues Quiz</button>
    </div>
    ${q.falsch.length ? `<h2 style="font:800 16px var(--schrift-mono);margin:28px 0 0">Zum Wiederholen</h2><ul class="fehlerliste">${q.falsch.map(f => `<li><div class="thema">${f.thema} · ${esc(themaTitel(f.thema))}</div><div>${fmt(f.f)}</div>
       <div>Richtig: <code>${esc(f.o.length ? f.l[0] + ") " + (f.o.find(o => o[0] === f.l[0]) || ["", ""])[1] : f.l[0])}</code></div></li>`).join("")}</ul>` : ""}
  </div></main>`;
  const falsche = document.getElementById("falsche");
  if (falsche) falsche.onclick = () => quizStarten(mischen([...q.falsch]));
  document.getElementById("neu").onclick = () => { quiz.laeuft = null; zeigeQuiz(); };
  window.scrollTo({ top: 0 });
}

document.addEventListener("keydown", e => {
  if (!location.hash.startsWith("#quiz") || !quiz.laeuft || quiz.laeuft.ende) return;
  const q = quiz.laeuft, f = q.fragen[q.pos];
  if (e.target.tagName === "INPUT" && !q.beantwortet) return;
  if (e.key === "Enter" && q.beantwortet && e.target.id !== "weiter") { e.preventDefault(); weiter(); return; }
  const b = e.key.toUpperCase();
  if (!q.beantwortet && f.o.length && f.o.some(o => o[0] === b) && !e.ctrlKey && !e.metaKey && !e.altKey) beantworten(b);
});

// ---------------- Übungen
function zeigeUebungen(offen) {
  app.className = "rahmen ohne-seite";
  app.innerHTML = `<main class="uebungen">
    <h1>Übungen</h1>
    <p class="lead">Jede Übung richtet einen eigenen Übungsordner ein und prüft deine Lösung automatisch. Dafür brauchst du ein Linux-Terminal, unter Windows z. B. Ubuntu in WSL. Einmal einrichten:</p>
    ${codeBlock(`git clone ${REPO}.git\ncd Linux_Grundlagen_Claude`)}
    <p class="hinweiszeile" style="margin-bottom:24px">Die Übungen laufen in <code>~/linux-uebungen</code>, so kann nichts kaputtgehen.</p>
    ${DATEN.uebungen.map(u => `<details class="uebung" id="uebung-${u.nr}"${u.nr === offen ? " open" : ""}>
      <summary><span class="nr">${u.nr}</span><span class="titel">${esc(u.titel)}</span><span class="pfeil" aria-hidden="true">›</span></summary>
      <div class="aufgabe">
        ${u.html}
        <div class="befehle">${codeBlock(`./uebung.sh start ${u.nr}      # Übung vorbereiten\n./uebung.sh pruefen ${u.nr}    # Lösung prüfen lassen\n./uebung.sh reset ${u.nr}      # von vorn beginnen`)}</div>
        <details class="tipp"><summary>Tipp anzeigen</summary><p>${fmt(u.hinweis)}</p></details>
      </div></details>`).join("")}
  </main>`;
  if (offen) {
    const ziel = document.getElementById("uebung-" + offen);
    if (ziel) requestAnimationFrame(() => ziel.scrollIntoView());
  }
}

// ---------------- Router
function route() {
  const h = location.hash.slice(1) || "start";
  let bereich = "start";
  if (h.startsWith("lektion-")) { bereich = "lektion"; zeigeLektion(h.slice(8)); window.scrollTo({ top: 0 }); }
  else if (h === "quiz") { bereich = "quiz"; zeigeQuiz(); window.scrollTo({ top: 0 }); }
  else if (h === "uebungen" || h.startsWith("uebung-")) { bereich = "uebungen"; zeigeUebungen(h.startsWith("uebung-") ? h.slice(7) : null); if (h === "uebungen") window.scrollTo({ top: 0 }); }
  else { zeigeStart(); window.scrollTo({ top: 0 }); }
  document.querySelectorAll(".reiter a").forEach(a => { if (a.dataset.bereich === bereich) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const titel = { start: "Linux-Grundlagen", lektion: "Lektionen", quiz: "Quiz", uebungen: "Übungen" }[bereich];
  document.title = bereich === "start" ? "Linux-Grundlagen" : `${titel} · Linux-Grundlagen`;
}

app.addEventListener("click", async e => {
  const b = e.target.closest(".kopieren");
  if (!b) return;
  const text = b.parentElement.querySelector("code").innerText;
  try { await navigator.clipboard.writeText(text); b.textContent = "Kopiert ✓"; }
  catch { b.textContent = "Bitte markieren"; }
  setTimeout(() => { b.textContent = "Kopieren"; }, 1600);
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
